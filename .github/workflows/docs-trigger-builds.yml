name: "Trigger docs builds"

# Dispatches output generation builds. The reusable workflow determines which builds are
# triggered, the branch that each build runs on, and the environment (prod or dev) that the
# build generates output for.

permissions:
  contents: read
  actions: write

# List all the branches that contain publishable docs.
on:
  push:
    branches:
    - 'dev'
    - 'cypher-25'
    - 'cypher-5'
  workflow_dispatch:

jobs:
  trigger:
    name: Trigger builds
    uses: neo4j/docs-tools/.github/workflows/reusable-docs-trigger-builds.yml@v2
    # Inputs you can add:
    # with:
    #   # docs-dir: the path in the repo that contains the documentation source. You only need
    #   # to provide a value if the source is not in the repo root.
    #   docs-dir: docs
    #   # pdf: false: by default a PDF build is always triggered. Add this if you do not want to
    #   # generate a PDF for this project.
    #   pdf: false
    secrets:
      DOCS_DISPATCH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
